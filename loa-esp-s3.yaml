# Loa thông báo + nghe nhạc cho Home Assistant / Music Assistant / TriTue YouTube Player
# Phần cứng: ESP32-S3 N16R8 (16MB flash, 8MB PSRAM octal) + MAX98357
#
# Chân I2S đặt ở mục substitutions ngay dưới. Build bằng GitHub Actions thì chọn chân trên web GitHub,
# workflow tự truyền vào đây, không cần sửa file.
# Wi-Fi KHÔNG ghi trong firmware: lần đầu (hoặc khi mất Wi-Fi hơn 1 phút) loa tự phát Wi-Fi
# "Loa-ESP-xxxxxx" (mật khẩu 12345678). Kết nối vào đó, trang cấu hình tự mở: chọn Wi-Fi nhà, nhập mật khẩu.
# Cũng cấu hình được Wi-Fi qua cáp USB ngay trên trang nạp firmware (Improv).
#
# MAX98357: VIN -> 5V | GND -> GND | SD để trống | GAIN để trống = 9 dB (xem ghi chú cuối file)

substitutions:
  name: loa-esp
  friendly_name: Loa ESP
  pin_lrclk: GPIO16      # MAX98357 LRC
  pin_bclk: GPIO15       # MAX98357 BCLK
  pin_dout: GPIO7        # MAX98357 DIN
  ap_password: "12345678"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true   # nhiều loa cùng firmware không trùng tên (loa-esp-a1b2c3)
  min_version: 2026.9.0
  project:
    name: tx3.loa-esp-s3
    version: "2.0"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      # Chạy code từ PSRAM: âm thanh không bị khựng khi ESP đang ghi flash (lưu âm lượng, OTA)
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

external_components:
  - source:
      type: local
      path: components     # khối EQ 6 dải (components/eq_speaker), giống EQ của VBot

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false   # N16R8 chắc chắn có PSRAM: cho phép Wi-Fi dùng bộ đệm lớn hơn

logger:

api:

ota:
  - platform: esphome

wifi:
  # Không ghi SSID: cấu hình qua trang captive portal hoặc Improv, lưu vào flash, mất điện không mất
  power_save_mode: none     # tắt tiết kiệm điện Wi-Fi để nhạc không giật
  ap:
    password: ${ap_password}
    ap_timeout: 1min        # mất Wi-Fi nhà quá 1 phút: phát Wi-Fi cấu hình, vẫn tự thử kết nối lại

captive_portal:             # trang chọn Wi-Fi khi kết nối vào Wi-Fi của loa

improv_serial:              # cấu hình Wi-Fi qua cáp USB từ trang nạp firmware

web_server:                 # http://loa-esp-xxxxxx.local : xem trạng thái, khởi động lại, xoá Wi-Fi
  port: 80
  version: 3

button:
  - platform: restart
    name: Khởi động lại
  - platform: factory_reset
    name: Xoá cấu hình Wi-Fi (về mặc định)
    entity_category: config

sensor:
  - platform: wifi_signal
    name: Sóng Wi-Fi
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: Địa chỉ IP
    ssid:
      name: Wi-Fi đang kết nối

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: ${pin_lrclk}
    i2s_bclk_pin: ${pin_bclk}

speaker:
  # Loa thật: MAX98357, 1 kênh, khung I2S 32-bit (MAX98357 nhận 16/24/32-bit)
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: ${pin_dout}
    sample_rate: 48000
    bits_per_sample: 32bit
    channel: mono
    timeout: never          # I2S chạy liên tục -> không có tiếng bụp khi bắt đầu/dừng phát
    buffer_duration: 100ms

  # EQ 6 dải (100/250/630/1600/4000/10000 Hz) + lọc bỏ âm quá trầm, chỉnh trực tiếp trong Home Assistant.
  # Tự chừa khoảng trống theo mức tăng để không vỡ tiếng.
  - platform: eq_speaker
    id: eq_out
    output_speaker: i2s_speaker
    bits_per_sample: 32
    num_channels: 1
    sample_rate: 48000
    highpass_frequency: 50   # loa nhỏ không phát được dưới ~60 Hz: lọc bỏ cho đỡ rè, nghe to và sạch hơn
    bass: 5
    low_mid: 1
    mid: -1
    high_mid: 1
    treble: 3
    air: 3

  # Trộn 2 luồng: thông báo + nhạc (thông báo phát đè, nhạc tự nhỏ lại)
  - platform: mixer
    id: mixer_out
    output_speaker: eq_out
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_input
        timeout: never
      - id: media_input
        timeout: never

  # Resampler để 16-bit giống loa Voice PE: HA đã gửi sẵn 48 kHz/16-bit nên resampler chỉ chuyển thẳng.
  # (Nếu đặt 32-bit, resampler phải đổi số bit và luôn tự hạ -3 dB.) Mixer đổi sang 32-bit không hạ mức,
  # âm lượng phần mềm vẫn tính ở 32-bit trong loa I2S.
  - platform: resampler
    id: announcement_resampler
    output_speaker: announcement_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampler
    output_speaker: media_input
    sample_rate: 48000
    bits_per_sample: 16

media_source:
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000     # ~500KB đệm nhạc trong PSRAM: Wi-Fi chập chờn vẫn mượt
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000

media_player:
  - platform: speaker_source
    id: loa
    name: None
    volume_initial: 0.5
    volume_increment: 0.05
    volume_min: 0.4         # ESPHome giảm âm lượng tuyến tính -49..0 dB: 50% = -24,5 dB (quá nhỏ, nghe mỏng).
                            # 0.4 -> 50% = -14,7 dB, 70% = -8,8 dB, gần cách chỉnh âm lượng trên Pi. 0% vẫn tắt tiếng
    volume_max: 1.0         # EQ đã tự chừa khoảng trống chống vỡ tiếng nên mở được hết cỡ
    # announcement_volume: 0.7   # bỏ dấu # nếu muốn thông báo luôn ở mức âm lượng cố định
    announcement_pipeline:
      speaker: announcement_resampler
      format: FLAC          # FLAC: không nén mất dữ liệu, ESP giải mã nhẹ nhất. KHÔNG dùng MP3
      num_channels: 1
      sample_rate: 48000
      sources:
        - http_announcement_source
    media_pipeline:
      speaker: media_resampler
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      sources:
        - http_media_source
    # Có thông báo (TTS, chuông cửa...): nhạc nhỏ 20 dB, đọc xong nhạc to lại trong 1 giây
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      - if:
          condition:
            not:
              media_player.is_announcing: loa
          then:
            - mixer_speaker.apply_ducking:
                id: media_input
                decibel_reduction: 0
                duration: 1.0s

# ---------------- EQ: chỉnh trong Home Assistant (Thiết bị -> Loa ESP -> Cấu hình) ----------------
switch:
  - platform: template
    id: eq_switch
    name: EQ bật
    icon: mdi:equalizer
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(eq_out).set_enabled(true);
    turn_off_action:
      - lambda: id(eq_out).set_enabled(false);

select:
  - platform: template
    id: eq_preset
    name: EQ mẫu
    icon: mdi:tune-vertical
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Rõ nét
    options:
      - Tự chỉnh
      - Rõ nét
      - Bass mạnh
      - Cân bằng
      - Giọng nói
      - Ấm áp
      - Sôi động
      - Ban đêm
    on_value:
      - lambda: |-
          // bass, low_mid, mid, high_mid, treble, air (dB) — giống mẫu của VBot, "Bass mạnh" chỉnh cho loa nhỏ
          static const float P[8][6] = {
            {0, 0, 0, 0, 0, 0},     // Tự chỉnh: giữ nguyên các thanh
            {5, 1, -1, 1, 3, 3},    // Rõ nét: bass vừa, sáng tiếng, ít bị hạ mức (-3,3 dB)
            {9, 4, 0, 0, 1, 1},     // Bass mạnh (cho loa nhỏ: +5..6 dB vùng 50-250 Hz)
            {0, 0, 0, 0, 0, 0},     // Cân bằng
            {-2, -1, 0, 2, 2, 0},   // Giọng nói
            {3, 2, 0, -1, -2, -1},  // Ấm áp
            {4, 2, -1, 1, 3, 2},    // Sôi động
            {-3, -2, 0, 2, 1, -2},  // Ban đêm
          };
          if (i == 0 || i >= 8) return;
          id(eq_bass).make_call().set_value(P[i][0]).perform();
          id(eq_low_mid).make_call().set_value(P[i][1]).perform();
          id(eq_mid).make_call().set_value(P[i][2]).perform();
          id(eq_high_mid).make_call().set_value(P[i][3]).perform();
          id(eq_treble).make_call().set_value(P[i][4]).perform();
          id(eq_air).make_call().set_value(P[i][5]).perform();

number:
  - platform: template
    id: eq_bass
    name: EQ 100Hz Bass
    icon: mdi:speaker
    entity_category: config
    unit_of_measurement: dB
    min_value: -12
    max_value: 12
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 5
    on_value:
      - lambda: id(eq_out).set_band_gain(0, x);
  - platform: template
    id: eq_low_mid
    name: EQ 250Hz
    icon: mdi:sine-wave
    entity_category: config
    unit_of_measurement: dB
    min_value: -12
    max_value: 12
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 1
    on_value:
      - lambda: id(eq_out).set_band_gain(1, x);
  - platform: template
    id: eq_mid
    name: EQ 630Hz
    icon: mdi:sine-wave
    entity_category: config
    unit_of_measurement: dB
    min_value: -12
    max_value: 12
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: -1
    on_value:
      - lambda: id(eq_out).set_band_gain(2, x);
  - platform: template
    id: eq_high_mid
    name: EQ 1600Hz
    icon: mdi:sine-wave
    entity_category: config
    unit_of_measurement: dB
    min_value: -12
    max_value: 12
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 1
    on_value:
      - lambda: id(eq_out).set_band_gain(3, x);
  - platform: template
    id: eq_treble
    name: EQ 4000Hz Treble
    icon: mdi:sine-wave
    entity_category: config
    unit_of_measurement: dB
    min_value: -12
    max_value: 12
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 3
    on_value:
      - lambda: id(eq_out).set_band_gain(4, x);
  - platform: template
    id: eq_air
    name: EQ 10kHz
    icon: mdi:sine-wave
    entity_category: config
    unit_of_measurement: dB
    min_value: -12
    max_value: 12
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 3
    on_value:
      - lambda: id(eq_out).set_band_gain(5, x);
  - platform: template
    id: eq_preamp
    name: EQ Preamp
    icon: mdi:volume-plus
    entity_category: config
    unit_of_measurement: dB
    min_value: -12
    max_value: 6
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0
    on_value:
      - lambda: id(eq_out).set_preamp(x);
  - platform: template
    id: eq_highpass
    name: Lọc âm quá trầm
    icon: mdi:filter
    entity_category: config
    unit_of_measurement: Hz
    min_value: 0
    max_value: 200
    step: 10
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 50
    on_value:
      - lambda: id(eq_out).set_highpass_frequency(x);

# ---------------- GHI CHÚ PHẦN CỨNG (ảnh hưởng tiếng nhiều hơn phần mềm) ----------------
# GAIN của MAX98357: để trống = 9 dB | nối GND = 12 dB | nối VIN = 6 dB
#   Loa nhỏ/tiếng xì khi im lặng: hạ gain (6 dB) rồi tăng volume_max lên 1.0.
# Nguồn: 5V >= 2A, tụ 470-1000 µF sát chân VIN-GND của MAX98357, dây I2S ngắn (< 15 cm).
# Loa: 4 Ω 3-5 W loại toàn dải, đặt trong hộp kín: thay đổi lớn nhất về độ hay.
